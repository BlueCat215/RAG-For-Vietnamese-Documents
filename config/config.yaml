# Cố định seed để kết quả chạy (RAG / Random split) không bị biến động qua các lần test
seed: 42

# Cấu hình đường dẫn lưu trữ dữ liệu của dự án
paths:
  raw_dir: "data/raw" # Đầu vào: File PDF, Docx thô
  processed_dir: "data/processed" # Đầu ra: Chunks đã làm sạch và phân đoạn
  index_dir: "data/index" # Lưu file chỉ mục FAISS index
  qa_dir: "data/qa" # Bộ dữ liệu test benchmark (Ground truth QA)
  results_dir: "results" # Lưu log / metric đánh giá

# Cấu hình các mô hình trong pipeline RAG
models:
  # 1. Embedding model: Chuyển văn bản thành vector ngữ nghĩa
  embedding:
    name: "AITeamVN/Vietnamese_Embedding" # Model bge-m3 fine-tuned riêng cho tiếng Việt
    dim: 1024 # Kích thước vector output
    max_seq_length: 2048 # Độ dài tối đa mô hình nhận vào (tokens)
    batch_size: 8 # Số đoạn văn xử lý cùng lúc
    normalize: true # Chuẩn hóa L2 vector để dùng Cosine Similarity / Inner Product
    query_prefix: "" # Prefix cho câu hỏi (bản này không dùng)
    passage_prefix: "" # Prefix cho đoạn văn (bản này không dùng)
    # CUDA dùng khi build index offline. Khi chạy chat online, dùng CPU trong code để tránh ăn VRAM.
    device: "cuda"

  # 2. Reranker model: Cross-Encoder chấm điểm và xếp hạng lại top k kết quả
  reranker:
    name: "thanhtantran/Vietnamese_Reranker" # Model Cross-Encoder học trên 1.1M cặp dữ liệu tiếng Việt
    top_n_to_rerank: 10 # Lấy top 10 từ Hybrid Search (BM25 + Vector) đưa vào Rerank (tối ưu tốc độ)
    top_k_final: 5 # Giữ lại top 5 đoạn có điểm cao nhất để nạp vào LLM
    device: "cpu" # Ép chạy trên CPU để nhường 100% VRAM cho LLM

  # 3. Generator (LLM): Mô hình sinh câu trả lời dựa trên context
  llm:
    name: "Qwen/Qwen2.5-3B-Instruct" # LLM 3B thông số, tối ưu tốt cho tiếng Việt
    quantization: "4bit" # Lượng tử hóa 4-bit (bitsandbytes) để vừa GPU 4GB VRAM
    max_new_tokens: 350 # Giới hạn số token tối đa LLM sinh ra
    temperature: 0.1 # Nhiệt độ thấp (0.1) để giảm hallucination, bám sát context
    device: "cuda" # Giữ cố định LLM trên GPU

# Cấu hình chiến lược cắt nhỏ văn bản (Chunking)
chunking:
  strategy: "structural" # Cắt theo cấu trúc văn bản pháp luật (Điều / Khoản)
  max_tokens: 512 # Kích thước tối đa của 1 chunk (nằm an toàn trong max_seq_length 2048)
  overlap_ratio: 0.15 # Đè (gối đầu) 15% tokens giữa 2 chunk liền kề để tránh mất ngữ cảnh giáp ranh

# Cấu hình tầng truy xuất thông tin (Retrieval & Filtering)
retrieval:
  bm25:
    k1: 1.5 # Tham số kiểm soát độ bão hòa tần suất từ (Term Frequency)
    b: 0.75 # Tham số phạt độ dài văn bản (Document Length Normalization)
    mode: "dual" # Chế độ tách từ cho BM25: 'dual' (lai ghép âm tiết + từ ghép tiếng Việt)
  rrf:
    k: 60 # Hằng số k trong công thức Reciprocal Rank Fusion (kết hợp BM25 + Dense)
  refusal_threshold: 0.05 # Ngưỡng tau: Nếu score top-1 sau Rerank < 0.05 -> Từ chối trả lời (Out-of-domain)
